<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tikku Run" />
<meta name="theme-color" content="#10131f" />
<meta name="description" content="Tikku Run - ek chhote fox ka bada safar. Free browser platformer game." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Tikku Run</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10131f;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    background: #000;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
    border-radius: 6px;
    touch-action: none;
  }

  /* ---- touch controls: sirf phone/tablet pe, aur sirf khelte waqt ---- */
  #touch, #topbtns, #rotate { display: none; }
  body.touch #touch {
    display: flex; justify-content: space-between; align-items: flex-end;
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    pointer-events: none;
  }
  body.touch.inmenu #touch { display: none; }
  #touch .grp { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
  #touch button {
    --s: clamp(56px, 15vmin, 96px);
    width: var(--s); height: var(--s); border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55);
    background: rgba(20,24,40,.35);
    color: #fff; font-size: calc(var(--s) * 0.4); font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; padding: 0;
    backdrop-filter: blur(2px);
  }
  #touch button.big { --s: clamp(68px, 19vmin, 118px); background: rgba(255,180,60,.3); }
  #touch button.on { background: rgba(255,255,255,.45); transform: scale(.94); }
  #touch button.fire { background: rgba(255,87,34,.35); }
  #touch button.fire.off { opacity: .3; }

  body.touch #topbtns {
    display: flex; flex-direction: column; gap: 10px;
    position: fixed; top: 22%; right: max(10px, env(safe-area-inset-right));
  }
  #topbtns button {
    width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.4); background: rgba(0,0,0,.35);
    color: #fff; font-size: 18px; padding: 0;
  }

  /* phone seedha (portrait) pakda ho to chhota sa hint */
  @media (orientation: portrait) {
    body.touch #rotate {
      display: block; position: fixed; left: 0; right: 0; top: max(10px, env(safe-area-inset-top));
      margin: 0 auto; width: fit-content; max-width: 88vw;
      padding: 10px 16px; border-radius: 12px;
      background: rgba(255,204,77,.92); color: #222; font-weight: 700; font-size: 15px; text-align: center;
    }
    body.touch #topbtns { top: auto; bottom: calc(clamp(68px, 19vmin, 118px) + 40px); }
  }

  /* ---- Top 10 mein aane par naam likhne ka box ---- */
  #namebox {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(5,8,20,.6); align-items: center; justify-content: center;
  }
  #namebox.show { display: flex; }
  #namebox .card {
    background: #1d2340; border: 2px solid #ffcc4d; border-radius: 16px;
    padding: 18px 20px; width: min(420px, 88vw); text-align: center; color: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #nb-title { font-weight: 700; font-size: 18px; margin-bottom: 12px; color: #ffe082; }
  #nb-input {
    width: 100%; box-sizing: border-box; font-size: 20px; padding: 10px 12px;
    border-radius: 10px; border: 2px solid #8090c0; background: #0f1430; color: #fff;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  #namebox .row { display: flex; gap: 10px; margin-top: 14px; }
  #namebox .row button {
    flex: 1; font-size: 17px; font-weight: 700; padding: 10px; border-radius: 10px; border: 0;
    touch-action: manipulation;
  }
  #nb-ok { background: #ffcc4d; color: #3a2000; }
  #nb-skip { background: #3a4270; color: #fff; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="544"></canvas></div>
<div id="rotate"></div>
<div id="topbtns">
  <button data-act="pause" aria-label="Pause">&#10074;&#10074;</button>
  <button data-act="sound" aria-label="Sound">&#9835;</button>
  <button data-act="full" aria-label="Fullscreen">&#9974;</button>
</div>
<div id="touch">
  <div class="grp">
    <button data-key="ArrowLeft" aria-label="Left">&#9664;</button>
    <button data-key="ArrowRight" aria-label="Right">&#9654;</button>
  </div>
  <div class="grp">
    <button data-key="KeyF" id="firebtn" class="fire off" aria-label="Fire">&#128293;</button>
    <button data-key="ShiftLeft" aria-label="Run">&#187;</button>
    <button data-key="Space" class="big" aria-label="Jump">&#9650;</button>
  </div>
</div>
<div id="namebox">
  <div class="card">
    <div id="nb-title"></div>
    <input id="nb-input" maxlength="12" autocomplete="off" />
    <div class="row"><button id="nb-skip"></button><button id="nb-ok"></button></div>
  </div>
</div>
<script>
  // ---- Visitor counter (GoatCounter) ----
  var GC_CODE = 'harshbamniya1432';
  if (GC_CODE !== 'APNA-CODE') {
    var gc = document.createElement('script');
    gc.async = true;
    gc.src = 'https://gc.zgo.at/count.js';
    gc.setAttribute('data-goatcounter', 'https://' + GC_CODE + '.goatcounter.com/count');
    // profile page ke "Play here" (iframe) se khelne walon ko bhi gino
    gc.setAttribute('data-goatcounter-settings', '{"allow_frame": true}');
    document.head.appendChild(gc);
  }
  // ---- App (PWA): phone pe install + bina internet ke bhi chale ----
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
<script src="game.js"></script>
</body>
</html>
